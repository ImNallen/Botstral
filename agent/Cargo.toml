[package]
name = "botstral-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
nonproduction-test-worker = []

[dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

botstral-link = { path = "../link", features = ["tls"] }
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "signal", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
zeroize = "1.8"

[dev-dependencies]
rcgen = "0.13.2"
time = "0.3"
tempfile = "3.24"

[[bin]]
name = "botstral-agent"
path = "src/main.rs"

[[bin]]
name = "botstral-test-agent"
path = "src/test_main.rs"
required-features = ["nonproduction-test-worker"]
