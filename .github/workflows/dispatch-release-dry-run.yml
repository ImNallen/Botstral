name: Dispatch Release dry-run

on:
  push:
    branches:
      - cursor/worker-fixture-schema-6311
    paths:
      - .github/workflows/dispatch-release-dry-run.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Release nightly publish=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh workflow run Release --ref cursor/worker-fixture-schema-6311 -f channel=nightly -f publish=false
