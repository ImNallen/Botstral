name: Verify
on:
  push:
  pull_request:

jobs:
  m01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: manager/go.sum
      - run: make deps
      - run: make verify
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go -C manager build -o ../bin/botstral-linux-amd64 ./cmd/botstral
