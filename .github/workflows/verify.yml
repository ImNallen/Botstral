name: Verify

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt
      - run: make verify
      - uses: docker://rhysd/actionlint:1.7.7
