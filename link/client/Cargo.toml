[package]
name = "botstral-owner-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
probe-files = []

[dependencies]
botstral-link = { path = "..", features = ["tls"] }
base64 = "0.22.1"
futures-util.workspace = true
rand = "0.8.5"
rustls.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
libc = "0.2"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
zeroize = "1.8"
