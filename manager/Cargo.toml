[package]
name = "botstral-manager"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
nonproduction-test-worker = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
botstral-owner-client = { path = "../link/client", features = ["probe-files"] }
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

botstral-link = { path = "../link", features = ["tls"] }
age = "=0.12.1"
argon2 = "0.5.3"
axum = "0.8.8"
png = "=0.17.16"
percent-encoding = "2.3.2"
base64 = "0.22.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
libc = "0.2"
rand = "0.8.5"
rusqlite = { version = "0.38.0", features = ["bundled"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10.9"
sha1 = "0.10"
hmac = "0.12"
subtle = "2.6.1"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "fs", "io-util"] }
uuid = { version = "1.20", features = ["v4"] }
zeroize = "1.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }

jsonschema = { version = "=0.58.4", default-features = false }

[dev-dependencies]
tempfile = "3.24"

