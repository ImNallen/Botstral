[package]
name = "botstral-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]
resolver = "3"

[lib]
name = "botstral_desktop"

[[bin]]
name = "botstral-desktop"
path = "src/main.rs"
required-features = ["native-ui"]

[features]
default = ["native-ui"]
native-ui = ["dep:tauri", "dep:tauri-plugin-notification", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-deep-link"]

[build-dependencies]
tauri-build = { version = "=2.7.3", optional = true, features = [] }

[dependencies]
botstral-link = { path = "../../link", features = ["tls"] }
botstral-owner-client = { path = "../../link/client" }
base64 = "0.22.1"
sha2 = "0.10.9"
libc = "0.2"
keyring = { version = "=3.6.3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-dialog = { version = "=2.8.4", optional = true }
tauri-plugin-deep-link = { version = "=2.6.3", optional = true }

reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
uuid = { version = "1.20", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["serde"] }
tauri = { version = "=2.12.4", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-notification = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSSecureTextField", "NSTextField", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSThread", "NSArray"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[profile.release.build-override]
strip = false
